name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Hostinger SSH deployment configuration
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST || secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USERNAME || secrets.SSH_USERNAME }}
          SSH_PASS: ${{ secrets.HOSTINGER_PASSWORD || secrets.SSH_PASSWORD }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
        run: |
          MISSING=0

          if [ -z "$SSH_HOST" ]; then
            echo "::error title=Missing SSH Host::Required secret missing: HOSTINGER_HOST (or SSH_HOST). Please configure your Hostinger server IP or hostname in GitHub repository secrets."
            MISSING=1
          fi

          if [ -z "$SSH_USER" ]; then
            echo "::error title=Missing SSH Username::Required secret missing: HOSTINGER_USERNAME (or SSH_USERNAME). Please configure your Hostinger SSH username (e.g. u410255584) in GitHub repository secrets."
            MISSING=1
          fi

          if [ -z "$SSH_PASS" ] && [ -z "$SSH_KEY" ]; then
            echo "::error title=Missing SSH Authentication::Required authentication secret missing: Please configure either HOSTINGER_PASSWORD (or SSH_PASSWORD) for password auth, or HOSTINGER_SSH_KEY (or SSH_PRIVATE_KEY) for private key auth in GitHub repository secrets."
            MISSING=1
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "════════════════════════════════════════════════════════════════════════════════"
            echo "❌ DEPLOYMENT STOPPED: Required SSH secrets are missing from GitHub."
            echo "════════════════════════════════════════════════════════════════════════════════"
            echo "To fix this deployment, navigate to your GitHub repository:"
            echo "  GitHub -> Settings -> Secrets and variables -> Actions -> New repository secret"
            echo ""
            echo "Configure the following secrets (obtained from Hostinger hPanel > Advanced > SSH Access):"
            echo "  • HOSTINGER_HOST     : Server IP or hostname (e.g. 195.35.x.x or connect.hostingersite.com)"
            echo "  • HOSTINGER_USERNAME : SSH username (e.g. u410255584)"
            echo "  • HOSTINGER_PASSWORD : SSH password (or HOSTINGER_SSH_KEY for SSH private key)"
            echo "  • HOSTINGER_PORT     : Optional, defaults to 65002 (Hostinger Business Hosting SSH port)"
            echo "════════════════════════════════════════════════════════════════════════════════"
            exit 1
          fi

          echo "✅ SSH configuration validated: Host, Username, and Authentication credentials are provided."

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME || secrets.SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD || secrets.SSH_PASSWORD }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || secrets.SSH_PORT || 65002 }}
          command_timeout: 15m
          script: |
            cd ~/travinno

            # ── ONE-TIME CLEANUP: kill any stale pm2 process ──────────────────────────
            pm2 stop travinno 2>/dev/null || true
            pm2 delete travinno 2>/dev/null || true
            pm2 save --force 2>/dev/null || true

            # Force-clean any local untracked files and pull latest git changes (including travinno-data.json)
            git fetch origin main
            git reset --hard origin/main
            git clean -fd --exclude='.env' --exclude='*.db'
            rm -f public/images/home_hero.jpg

            # ── Write .env with Hostinger MySQL credentials & Cloudinary ─────────────
            printf 'DB_HOST=127.0.0.1\nDB_PORT=3306\nDB_USER=u410255584_tvm\nDB_PASSWORD=Travinno@2026\nDB_NAME=u410255584_travinno\nCLOUDINARY_CLOUD_NAME=fifyhrcr\nCLOUDINARY_API_KEY=462151937739666\nCLOUDINARY_API_SECRET=_lcjEAWwXMWr07V3Z7FUmawQks4\nNODE_ENV=production\n' > .env

            echo "✅ .env written:"
            cat .env

            # ── Write server.js that explicitly loads dotenv before starting Next ─────
            printf '%s\n' \
              "require('dotenv').config({ path: require('path').join(__dirname, '.env') });" \
              "const { createServer } = require('http');" \
              "const { parse } = require('url');" \
              "const next = require('next');" \
              "const dev = process.env.NODE_ENV !== 'production';" \
              "const app = next({ dev });" \
              "const handle = app.getRequestHandler();" \
              "app.prepare().then(() => {" \
              "  const socketOrPort = process.env.LSNODE_SOCKET || process.env.PORT || 3000;" \
              "  const server = createServer((req, res) => {" \
              "    const parsedUrl = parse(req.url, true);" \
              "    handle(req, res, parsedUrl);" \
              "  });" \
              "  if (typeof socketOrPort === 'string' && socketOrPort.startsWith('/')) {" \
              "    server.listen(socketOrPort, () => console.log('Ready on UNIX socket:', socketOrPort));" \
              "  } else {" \
              "    server.listen(socketOrPort, () => console.log('Ready on port:', socketOrPort));" \
              "  }" \
              "});" > server.js

            # Install ALL dependencies
            npm ci

            # ── Sync pushed travinno-data.json directly into live MySQL ───────────────
            node -e "
              require('dotenv').config();
              const mysql = require('mysql2/promise');
              const fs = require('fs');
              async function sync() {
                try {
                  if (!fs.existsSync('travinno-data.json')) return;
                  const data = JSON.parse(fs.readFileSync('travinno-data.json', 'utf8'));
                  const pool = mysql.createPool({
                    host: process.env.DB_HOST || '127.0.0.1',
                    port: parseInt(process.env.DB_PORT || '3306', 10),
                    user: process.env.DB_USER,
                    password: process.env.DB_PASSWORD,
                    database: process.env.DB_NAME
                  });
                  await pool.query('CREATE TABLE IF NOT EXISTS travinno_collections (col_key VARCHAR(255) PRIMARY KEY, col_value LONGTEXT NOT NULL)');
                  for (const [k, v] of Object.entries(data)) {
                    const strVal = typeof v === 'string' ? v : JSON.stringify(v);
                    await pool.query(
                      'INSERT IGNORE INTO travinno_collections (col_key, col_value) VALUES (?, ?)',
                      [k, strVal]
                    );
                  }
                  console.log('✅ Initialized travinno_collections table in Hostinger MySQL (preserving existing live data)');
                  await pool.end();
                } catch(e) {
                  console.log('MySQL sync note:', e.message);
                }
              }
              sync();
            "

            # Build with increased memory limit to prevent OOM crashes on shared hosting
            export NODE_OPTIONS="--max-old-space-size=1536"
            npm run build

            # Verify .env still exists after build (sanity check)
            echo "🔍 .env after build:"
            cat .env

            # ── Restart the Node.js app via Phusion Passenger ─────────────────────────
            mkdir -p tmp
            touch tmp/restart.txt
            echo "🔄 Passenger restart triggered via tmp/restart.txt"

            echo "✅ Travinno deployment complete"
