name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: 22
          command_timeout: 15m
          script: |
            cd ~/travinno

            # ── ONE-TIME CLEANUP: kill any stale pm2 process ──────────────────────────
            pm2 stop travinno 2>/dev/null || true
            pm2 delete travinno 2>/dev/null || true
            pm2 save --force 2>/dev/null || true

            # Backup live server data file so git reset doesn't overwrite admin edits
            if [ -f travinno-data.json ]; then
              cp travinno-data.json /tmp/travinno-data.json.bak 2>/dev/null || true
            fi

            # Force-clean any local changes that might block git pull
            git fetch origin main
            git reset --hard origin/main
            git clean -fd --exclude='.env' --exclude='*.db' --exclude='travinno-data.json'

            # ── Write .env with Hostinger MySQL credentials ───────────────────────────
            # MUST be written before the build (Next.js reads it at build time)
            # AND must persist after build so server.js loads it at runtime.
            printf 'DB_HOST=127.0.0.1\nDB_PORT=3306\nDB_USER=u410255584_tvn\nDB_PASSWORD=Travinno2026\nDB_NAME=u410255584_Travinno2\nNODE_ENV=production\n' > .env

            echo "✅ .env written:"
            cat .env

            # Restore live server data file if backup exists
            if [ -f /tmp/travinno-data.json.bak ]; then
              cp /tmp/travinno-data.json.bak travinno-data.json 2>/dev/null || true
              rm -f /tmp/travinno-data.json.bak 2>/dev/null || true
            fi

            # ── Write server.js that explicitly loads dotenv before starting Next ─────
            # Phusion Passenger calls server.js directly. Without dotenv.config(),
            # process.env does NOT have DB_HOST etc. because Passenger does NOT
            # source .env automatically. This is why MySQL was showing "not set".
            printf '%s\n' \
              "require('dotenv').config({ path: require('path').join(__dirname, '.env') });" \
              "const { createServer } = require('http');" \
              "const { parse } = require('url');" \
              "const next = require('next');" \
              "const dev = process.env.NODE_ENV !== 'production';" \
              "const app = next({ dev });" \
              "const handle = app.getRequestHandler();" \
              "app.prepare().then(() => {" \
              "  const socketOrPort = process.env.LSNODE_SOCKET || process.env.PORT || 3000;" \
              "  const server = createServer((req, res) => {" \
              "    const parsedUrl = parse(req.url, true);" \
              "    handle(req, res, parsedUrl);" \
              "  });" \
              "  if (typeof socketOrPort === 'string' && socketOrPort.startsWith('/')) {" \
              "    server.listen(socketOrPort, () => console.log('Ready on UNIX socket:', socketOrPort));" \
              "  } else {" \
              "    server.listen(socketOrPort, () => console.log('Ready on port:', socketOrPort));" \
              "  }" \
              "});" > server.js

            # Install ALL dependencies (dotenv needed at runtime for server.js)
            npm ci

            # Build with increased memory limit to prevent OOM crashes on shared hosting
            export NODE_OPTIONS="--max-old-space-size=1536"
            npm run build

            # Verify .env still exists after build (sanity check)
            echo "🔍 .env after build:"
            cat .env

            # ── Restart the Node.js app via Phusion Passenger ─────────────────────────
            mkdir -p tmp
            touch tmp/restart.txt
            echo "🔄 Passenger restart triggered via tmp/restart.txt"

            echo "✅ Travinno deployment complete"
